  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
  return new TextDecoder().decode(buf);
}
let busy=false;
async function go(pw,remember){
  const err=document.getElementById('err');
  if(busy)return;
  if(!window.crypto||!crypto.subtle){err.textContent='Hier kann ich nicht entschlüsseln (Vorschau oder unsichere Verbindung). Öffne die Seite direkt im Browser über https.';return;}
  busy=true;err.textContent='Simone prüft ...';
  let html;
  try{html=await open_(pw);}
  catch(e){busy=false;err.textContent='Falsches Passwort. Simone guckt dich böse an.';try{localStorage.removeItem('mr_pw');}catch(e2){}return;}
  if(remember){try{localStorage.setItem('mr_pw',pw);}catch(e){}}
  try{document.open();document.write(html);document.close();}
  catch(e){busy=false;err.textContent='Passwort stimmt, aber diese Vorschau lässt das Spiel nicht starten. Öffne die Seite direkt im Browser.';}
}
const pwEl=document.getElementById('pw'),start=()=>go(pwEl.value,document.getElementById('rem').checked);
document.getElementById('go').addEventListener('click',start);
pwEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();start();}});
try{const s=localStorage.getItem('mr_pw');if(s)go(s,false);}catch(e){}
</script>
