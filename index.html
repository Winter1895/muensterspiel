<style>
html,body{margin:0;height:100%;background:#15121d;color:#f3eee2;font-family:'VT323',monospace;font-size:22px}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{background:#211c2e;border:3px solid #ffcc33;border-radius:12px;padding:26px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,204,51,.15)}

p{margin:6px 0 16px;color:#d9d3ea}

button{margin-top:12px;width:100%;font-family:'Press Start 2P',monospace;font-size:12px;padding:12px;border-radius:8px;border:2px solid #ffcc33;background:#5a2a00;color:#fff;cursor:pointer}
label{display:block;margin-top:10px;font-size:18px;color:#a59fb8}
.err{color:#ff5a5f;min-height:1.2em;margin-top:10px}
</style>
</head>

<div class="wrap"><form class="box" id="f">

<label><input id="rem" type="checkbox" style="width:auto"> auf diesem Gerät merken</label>
<button type="submit">▶ REIN DA</button>

</form></div>

async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
  return new TextDecoder().decode(buf);
}
async function go(pw,remember){
  const err=document.getElementById('err');err.textContent='Simone prüft ...';
  try{const html=await open_(pw);
    if(remember){try{localStorage.setItem('mr_pw',pw);}catch(e){}}
    document.open();document.write(html);document.close();
  }catch(e){err.textContent='Falsches Passwort. Simone guckt dich böse an.';try{localStorage.removeItem('mr_pw');}catch(e2){}}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('pw').value,document.getElementById('rem').checked);});
try{const s=localStorage.getItem('mr_pw');if(s)go(s,false);}catch(e){}
